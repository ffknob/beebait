[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["beebait/+/uplink"]
  client_id = "telegraf"
  data_format = "json"
  name_override = "beebait"
  tag_keys = ["beebait_id"]
  json_time_key = "timestamp"
  json_time_format = "unix_ms"
  topic_tag = ""

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "beebait"
  bucket = "beebait"
